name: bootstrap-validation

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Positive candidate validation
        run: python engineering/scripts/validate_bootstrap.py | tee positive-test-evidence.txt
      - name: Positive and negative regression tests
        run: python -m unittest -v engineering/tests/test_validator.py 2>&1 | tee regression-test-evidence.txt
