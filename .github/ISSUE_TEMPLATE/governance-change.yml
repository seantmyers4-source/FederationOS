name: Governance change
description: Propose a governed FederationOS repository change
title: "[GOV] "
body:
  - type: input
    id: authority
    attributes: {label: Owning authority}
    validations: {required: true}
  - type: input
    id: directive
    attributes: {label: Directive or decision}
